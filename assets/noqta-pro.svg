<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">NOQTA Pro — نقطة مهني</title>
  <desc id="desc">A modern professional identity mark combining a profile card, a clear point, and forward motion.</desc>
  <defs>
    <linearGradient id="proGradient" x1="22" y1="20" x2="154" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#31C7F5"/>
    </linearGradient>
    <filter id="proShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4F46E5" flood-opacity=".2"/>
    </filter>
  </defs>
  <g filter="url(#proShadow)">
    <rect x="20" y="20" width="160" height="160" rx="48" fill="#111629"/>
    <path d="M58 67c0-11 9-20 20-20h44c11 0 20 9 20 20v66c0 11-9 20-20 20H78c-11 0-20-9-20-20V67Z" fill="none" stroke="url(#proGradient)" stroke-width="10"/>
    <circle cx="99" cy="83" r="14" fill="url(#proGradient)"/>
    <path d="M79 119h42M79 137h27" stroke="#F4F7FF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="146" cy="137" r="16" fill="#31C7F5" stroke="#111629" stroke-width="7"/>
  </g>
  <g font-family="Cairo, Tajawal, Arial, sans-serif">
    <text x="212" y="88" font-size="52" font-weight="800" fill="#111629">نقطة <tspan fill="#6D5DFB">مهني</tspan></text>
    <text x="214" y="128" font-size="28" font-weight="800" fill="#111629" letter-spacing="1.5">NOQTA <tspan fill="#6D5DFB">PRO</tspan></text>
    <text x="214" y="158" font-size="17" font-weight="600" fill="#677087">خبرتك، بصيغة تُرى.</text>
  </g>
</svg>
