<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-biz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="grad-dark-biz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow-biz" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>  
  
  <!-- Background Badge -->
  <rect x="5" y="5" width="490" height="140" rx="20" fill="url(#grad-dark-biz)" stroke="#059669" stroke-width="2"/>
  
  <!-- Logo Symbol: Storefront & Location Pin Node -->
  <g transform="translate(30, 20)">
    <!-- Storefront Outline -->
    <path d="M 20 45 L 50 15 L 80 45 L 80 85 L 20 85 Z" fill="none" stroke="url(#grad-biz)" stroke-width="4" filter="url(#glow-biz)"/>
    <!-- Canopy roof -->
    <path d="M 15 45 L 85 45" stroke="url(#grad-orange)" stroke-width="5" stroke-linecap="round"/>
    <!-- Central Node / Glowing Order Dot -->
    <circle cx="50" cy="62" r="12" fill="url(#grad-orange)"/>
    <circle cx="50" cy="62" r="5" fill="#FFFFFF"/>
    <!-- Signal Waves -->
    <path d="M 30 25 A 25 25 0 0 1 70 25" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography Arabic & English -->
  <text x="150" y="65" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF">نقطة <tspan fill="#10B981">أعمال</tspan></text>
  <text x="150" y="95" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#A7F3D0" letter-spacing="2">NOQTA BIZ • LOCAL BUSINESS &amp; MENUS</text>
  <text x="150" y="120" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#F59E0B">«نقطة وصول زبونك الأول»</text>
</svg>
