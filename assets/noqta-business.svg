<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">NOQTA Business — نقطة أعمال</title>
  <desc id="desc">A modern local-business identity mark combining a digital window, a location point, and a direct path.</desc>
  <defs>
    <linearGradient id="bizGradient" x1="24" y1="22" x2="170" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB34D"/>
      <stop offset="1" stop-color="#FF5F57"/>
    </linearGradient>
    <filter id="bizShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#E8593C" flood-opacity=".2"/>
    </filter>
  </defs>
  <g filter="url(#bizShadow)">
    <rect x="20" y="20" width="160" height="160" rx="48" fill="#16211F"/>
    <path d="M56 75 100 48l44 27v56c0 13-10 23-23 23H79c-13 0-23-10-23-23V75Z" fill="none" stroke="url(#bizGradient)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M78 96h44M78 116h31" stroke="#FFF7EC" stroke-width="9" stroke-linecap="round"/>
    <path d="M121 139c0-13 10-23 23-23s23 10 23 23c0 17-23 34-23 34s-23-17-23-34Z" fill="#FF795F" stroke="#16211F" stroke-width="7"/>
    <circle cx="144" cy="139" r="7" fill="#FFF7EC"/>
  </g>
  <g font-family="Cairo, Tajawal, Arial, sans-serif">
    <text x="212" y="88" font-size="52" font-weight="800" fill="#111629">نقطة <tspan fill="#EF6548">أعمال</tspan></text>
    <text x="214" y="128" font-size="28" font-weight="800" fill="#111629" letter-spacing="1.5">NOQTA <tspan fill="#EF6548">BUSINESS</tspan></text>
    <text x="214" y="158" font-size="17" font-weight="600" fill="#677087">من البحث… إلى تواصل مباشر.</text>
  </g>
</svg>
